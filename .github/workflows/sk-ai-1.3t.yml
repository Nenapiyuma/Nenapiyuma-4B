name: SK AI 1.3T validation

on:
  push:
    branches: ["sk-ai-1.3t-audit"]
  pull_request:
    branches: ["main"]

jobs:
  accounting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SK-AI-1.3T
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q
